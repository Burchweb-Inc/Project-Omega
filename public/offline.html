<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LockIn | Offline</title>
  <style>
    :root { color-scheme: light; --ink: #172b4d; --muted: #71859a; --paper: #f4f7fa; --coral: #e86f51; --gold: #edb84d; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: var(--paper); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 520px; text-align: center; }
    img { width: 76px; height: 76px; object-fit: contain; margin-bottom: 24px; }
    h1 { margin: 0 0 12px; font: 700 42px/1.05 system-ui, sans-serif; letter-spacing: -.04em; }
    p { margin: 0 0 24px; color: var(--muted); }
    a { display: inline-block; padding: 11px 16px; background: var(--coral); color: white; text-decoration: none; font-weight: 700; }
    a:hover { background: var(--ink); }
  </style>
</head>
<body>
  <main>
    <img src="/media/offline/logo.png" alt="LockIn">
    <h1>You are offline.</h1>
    <p>LockIn could not reach the network. Reconnect and try again to return to your workspace.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
