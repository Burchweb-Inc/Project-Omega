services:
  project-omega-main:
    image: project-omega:main
    container_name: project-omega
    ports:
      - "8891:3000"
    volumes:
      - database:/home/node/app/data
    networks:
      - vps
    restart: unless-stopped
    secrets:
      - openrouter_api_key
    environment:
      - NODE_ENV=production
      - ORIGIN=https://lockedin.burchweb.com
      - OPENROUTER_MODEL=nvidia/nemotron-3-ultra-550b-a55b:free
      - BAD_WORD_REVIEW_INTERVAL_MINUTES=10
      - BAD_WORD_REVIEW_INTERVAL_MS=600000
      - APP_MODE=beta
      - APPLE_CALDEV_SERVER=https://caldev.apple.com
      - GOOGLE_TASKS_REDIRECT_URI=https://lockedin.burchweb.com/integrations/google/callback
      - GOOGLE_TASKS_CLIENT_ID=216693838523-t33raubm0ulko1tq55fjs31liseevh9r.apps.googleusercontent.com
secrets:
  openrouter_api_key:
    environment: OPENROUTER_API_KEY
  snarkytype_client_id:
    environment: SNARKYTYPE_CLIENT_ID
  snarkytype_client_secret:
    environment: SNARKYTYPE_CLIENT_SECRET
  google_tasks_client_secret:
    environment: GOOGLE_TASKS_CLIENT_SECRET

volumes:
  database:

networks:
  vps:
    external: true
